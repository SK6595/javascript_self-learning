<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <!-- 「onclick」はHTMLのイベント定義の属性 -->
  <!-- クリックされた時にcautionという関数をイベントから呼び出す -->
  <button id="open_button">表示する</button>
    <div id="long_content">
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
        <p>長いコンテンツ</p>
    </div>

    <script>
      // アロー関数
      // cautionが関数となっている。
      // const caution = () => {
      //   alert('クリックされました');
      // }

      const longContent = document.getElementById('long_content');
      longContent.style.display = 'none';
      // 「open_button」というIDが付いたHTMLの要素を取得して そしてという感じで そのまま取得した要素に「addEventListener」にイベントを割り当てる
      document.getElementById('open_button').addEventListener('click', () => {
        longContent.style.display = 'block';
      });

      /*
      function caution() {
        alert('クリックされました');
      }

      const caution = function() {
        alert('クリックされました');
      }
      */
    </script>
</body>
</html>
