<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const today = new Date(); // todayは日付を司ることができるオブジェクトになる。
      const theYear = today.getFullYear();
      const theMonth = today.getMonth() + 1; // 0-11で取得
      const theDate = today.getDate(); // getDateメソッドはパラメータが空でも問題ない。
      document.write(
        '今日は、' + theYear + '/'
          + theMonth + '/' + theDate + 'です');
    </script>
  </body>
</html>
