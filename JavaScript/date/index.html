<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      const today = new Date();
      const theDate = today.getDate(); // getDateメソッドはパラメータが空でも問題ない。
      document.write('今日は、2025/01/' + theDate + 'です');
    </script>
  </body>
